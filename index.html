<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UPI QR Code Generator</title>
  <meta name="description" content="Clean and simple UPI QR Code Generator. Enter a UPI ID to generate a payment QR code instantly.">
  <link rel="stylesheet" href="style.css?v=4">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>UPI QR Code Generator</h1>
      <p>Enter your UPI ID to generate a payment QR code</p>
    </header>

    <main class="card">
      <!-- UPI & Optional Amount Form -->
      <form id="qrForm" class="input-form" autocomplete="off" onsubmit="event.preventDefault();">
        <div class="form-inputs">
          <div class="input-box upi-box">
            <input 
              type="text" 
              id="upiId" 
              placeholder="UPI ID (e.g. name@bank)" 
              autocomplete="off" 
              spellcheck="false" 
              autofocus
            >
            <button type="button" id="clearBtn" class="clear-btn hidden" title="Clear input">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
          </div>
          <div class="input-box amount-box">
            <span class="currency-prefix">₹</span>
            <input 
              type="number" 
              id="amount" 
              placeholder="Amount (optional)" 
              min="1" 
              max="100000" 
              step="any" 
              inputmode="decimal"
            >
          </div>
        </div>
        <button type="submit" id="generateBtn" class="btn-generate">Generate QR</button>
      </form>

      <!-- QR Code Display Area -->
      <div class="qr-wrapper">
        <div id="qrcode" class="qrcode">
          <div class="placeholder">
            <svg class="placeholder-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="7" height="7"></rect>
              <rect x="14" y="3" width="7" height="7"></rect>
              <rect x="14" y="14" width="7" height="7"></rect>
              <rect x="3" y="14" width="7" height="7"></rect>
              <path d="M7 17h.01"></path>
              <path d="M17 17h.01"></path>
              <path d="M7 7h.01"></path>
              <path d="M7 17h.01"></path>
            </svg>
            <span>Enter UPI ID above</span>
          </div>
        </div>
      </div>

      <!-- Under QR UPI Label & Copy -->
      <div id="upiDisplay" class="upi-display hidden">
        <div class="upi-info-row">
          <span id="upiText"></span>
          <span id="amountBadge" class="amount-badge hidden"></span>
        </div>
        <button type="button" id="copyUpiBtn" class="icon-btn" title="Copy UPI ID">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
        </button>
      </div>

      <!-- Action Button -->
      <div class="actions">
        <button type="button" id="downloadBtn" class="btn-download-full" disabled>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          Download QR
        </button>
      </div>
    </main>

    <footer class="footer">
      <p>Clean &amp; Private • Generated client-side</p>
    </footer>

    <!-- Toast message -->
    <div id="toast" class="toast hidden"></div>
  </div>

  <script src="qrcode.min.js"></script>
  <script src="script.js?v=4"></script>
</body>
</html>
