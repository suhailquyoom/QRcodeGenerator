<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>UPI QR Code Generator</title>
  <meta name="description" content="Instant UPI to QR Code converter for Digital Rupee and UPI apps. Auto-generates QR as you paste.">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="UPI QR">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
  <link rel="stylesheet" href="style.css?v=7">
</head>
<body>
  <!-- Toast notification banner at the top -->
  <div id="toast" class="toast hidden" role="alert" aria-live="polite"></div>

  <div class="container">
    <header class="header">
      <div class="header-top">
        <h1>UPI QR Code Generator</h1>
        <button type="button" id="installPwaBtn" class="btn-install hidden" title="Install as fullscreen app">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
            <line x1="12" y1="18" x2="12.01" y2="18"></line>
          </svg>
          Install App
        </button>
      </div>
      <p>Paste UPI ID &amp; amount — QR generates automatically</p>
    </header>

    <main class="card">
      <!-- Live Auto-Generating UPI & Amount Inputs (No Generate Button Needed) -->
      <form id="qrForm" class="input-form" autocomplete="off" onsubmit="event.preventDefault();">
        <div class="form-inputs">
          <!-- UPI ID Input -->
          <div class="input-box upi-box">
            <input 
              type="text" 
              id="upiId" 
              placeholder="UPI ID (e.g. name@bank)" 
              autocomplete="off" 
              spellcheck="false" 
              enterkeyhint="next"
              autofocus
            >
            <button type="button" id="clearBtn" class="clear-btn hidden" title="Clear UPI ID" aria-label="Clear UPI ID">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
          </div>

          <!-- Amount Input (type="text" with inputmode="decimal" for full keyboard clipboard auto-suggest) -->
          <div class="input-box amount-box">
            <span class="currency-prefix">₹</span>
            <input 
              type="text" 
              id="amount" 
              placeholder="Amount (optional)" 
              inputmode="decimal" 
              autocomplete="off" 
              spellcheck="false"
              enterkeyhint="done"
            >
            <button type="button" id="clearAmountBtn" class="clear-btn hidden" title="Clear amount" aria-label="Clear amount">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
          </div>
        </div>
      </form>

      <!-- Above-QR UPI & Exact Amount Info Row -->
      <div id="upiDisplay" class="upi-display hidden">
        <div class="upi-info-row">
          <span id="upiText"></span>
          <span id="amountBadge" class="amount-badge hidden"></span>
        </div>
        <button type="button" id="copyUpiBtn" class="icon-btn" title="Copy UPI ID" aria-label="Copy UPI ID">
          <svg id="copyIcon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
          <svg id="checkIcon" class="hidden" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </button>
      </div>

      <!-- QR Code Display Area -->
      <div class="qr-wrapper">
        <div id="qrcode" class="qrcode">
          <div class="placeholder">
            <svg class="placeholder-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="7" height="7"></rect>
              <rect x="14" y="3" width="7" height="7"></rect>
              <rect x="14" y="14" width="7" height="7"></rect>
              <rect x="3" y="14" width="7" height="7"></rect>
              <path d="M7 17h.01"></path>
              <path d="M17 17h.01"></path>
              <path d="M7 7h.01"></path>
              <path d="M7 17h.01"></path>
            </svg>
            <span>Paste UPI ID above</span>
          </div>
        </div>
      </div>

      <!-- Action Button directly under QR -->
      <div class="actions">
        <button type="button" id="downloadBtn" class="btn-download-full" disabled>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          Download QR
        </button>
      </div>
    </main>

    <footer class="footer">
      <p>Clean &amp; Private • Instant Live QR</p>
    </footer>
  </div>

  <script src="qrcode.min.js"></script>
  <script src="script.js?v=7"></script>
</body>
</html>
